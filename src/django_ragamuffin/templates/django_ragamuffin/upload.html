{% load static %}
<html>
<body>
<form id="upload-form" method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <input id="upload-files" type="file" name="myfile" multiple required>
  <button id="upload-button" type="submit">Upload File</button>
</form>
<div id="upload-progress-container" hidden>
  <progress id="upload-progress" value="0" max="1"></progress>
  <span id="upload-progress-text" aria-live="polite"></span>
</div>
{% if file_url %}
  <p>Uploaded file: <a href="{{ file_url }}">{{ file_url }}</a></p>
{% endif %}
<script>
  document.getElementById("upload-form").addEventListener("submit", async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    const fileInput = document.getElementById("upload-files");
    const uploadButton = document.getElementById("upload-button");
    const progressContainer = document.getElementById("upload-progress-container");
    const progress = document.getElementById("upload-progress");
    const progressText = document.getElementById("upload-progress-text");
    const files = Array.from(fileInput.files);
    const total = files.length;
    const uploadId = crypto.randomUUID();
    const formData = new FormData(form);
    formData.append("upload_id", uploadId);

    uploadButton.disabled = true;
    fileInput.disabled = true;
    progress.max = total;
    progress.value = 0;
    progressContainer.hidden = false;
    progressText.textContent = `0/${total} completed`;

    const statusUrl = `${window.location.pathname}status/${uploadId}/`;
    let polling = false;

    async function updateProgress() {
      if (polling) {
        return;
      }
      polling = true;
      try {
        const response = await fetch(statusUrl, { credentials: "same-origin" });
        if (response.ok) {
          const status = await response.json();
          const completed = Math.min(status.completed, total);
          progress.value = completed;
          progressText.textContent = `${completed}/${total} completed`;
          if (status.failed) {
            progressText.textContent += " — upload failed";
          }
        }
      } catch (error) {
        console.error(error);
      } finally {
        polling = false;
      }
    }

    const intervalId = window.setInterval(updateProgress, 1000);
    try {
      const response = await fetch(form.action || window.location.href, {
        method: "POST",
        body: formData,
        credentials: "same-origin",
      });
      if (!response.ok) {
        throw new Error(`Upload failed with status ${response.status}`);
      }

      await updateProgress();
      window.location.assign(response.url);
    } catch (error) {
      progressText.textContent = `${progress.value}/${total} completed — upload failed`;
      uploadButton.disabled = false;
      fileInput.disabled = false;
      console.error(error);
    } finally {
      window.clearInterval(intervalId);
    }
  });
</script>
</body>
</html>
